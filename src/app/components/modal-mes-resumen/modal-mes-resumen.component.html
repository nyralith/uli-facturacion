<div mat-dialog-content class="modal-content">
  <h3>Información del PDF</h3>
  <div class="form-container">
    <mat-form-field appearance="outline">
      <mat-label>Mes y Año</mat-label>
      <input matInput 
             [(ngModel)]="data.data" 
             placeholder="ej: Octubre 2025"
             required>
      <mat-hint>Formato: Mes AAAA</mat-hint>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Sanatorio</mat-label>
      <input matInput 
             [(ngModel)]="data.sanatorio" 
             placeholder="Sanatorio Sur"
             required>
      <mat-hint>Nombre del establecimiento</mat-hint>
    </mat-form-field>
  </div>

  <div mat-dialog-actions class="dialog-actions">
  <button mat-button 
          color="warn" 
          (click)="onNoClick()">
    Cancelar
  </button>
  <button mat-raised-button 
          color="primary" 
          [mat-dialog-close]="data"
          [disabled]="!data.data || !data.sanatorio"
          cdkFocusInitial>
    Generar PDF
  </button>
</div>
</div>
